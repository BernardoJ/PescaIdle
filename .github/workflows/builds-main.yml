name: Builds derivados da main e validacao nativa
on:
  push:
    branches: [codex/builds-main-20261027]
    paths:
      - '.github/workflows/builds-main.yml'
      - 'tools/**'
      - 'pesca_*.py'
      - 'piloto_entry.py'
      - 'main.py'
      - 'assets/**'
      - '*requirements*.txt'
      - '*.spec'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: builds-main-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-main:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: tooling
      - uses: actions/checkout@v5
        with:
          ref: f8190f5e6a7b2690a6d00eb8f1ef727cfe0bba34
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias oficiais fixadas, sem cache de build
        run: python -m pip install -r source/requirements-build.txt
      - name: Build limpo da main fixa, identidade do pacote e teste Windows nativo
        run: python tooling/tools/build_windows_main.py --source source --expected-commit f8190f5e6a7b2690a6d00eb8f1ef727cfe0bba34 --out "${{ runner.temp }}/windows-main"
      - uses: actions/upload-artifact@v4
        with:
          name: PescaIdle-Windows-main-f8190f5-validado
          if-no-files-found: error
          path: ${{ runner.temp }}/windows-main/deliverables/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidencias-Windows-main-f8190f5
          path: |
            ${{ runner.temp }}/windows-main/*.json
            ${{ runner.temp }}/windows-main/*.log
            ${{ runner.temp }}/windows-main/qa/**/*.json
            ${{ runner.temp }}/windows-main/qa/**/*.png
            ${{ runner.temp }}/windows-main/qa/**/*.log
            ${{ runner.temp }}/windows-main/qa/**/*.txt
            ${{ runner.temp }}/windows-main/package/qa/**/*.json
            ${{ runner.temp }}/windows-main/package/qa/**/*.png
            ${{ runner.temp }}/windows-main/package/qa/**/*.log
            ${{ runner.temp }}/windows-main/package/qa/**/*.txt
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencias Android ja adotadas pelo projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev libffi-dev libssl-dev pkg-config cmake ninja-build libxcb-cursor0 libegl1 libxkbcommon0
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install PySide6==6.11.2 buildozer==1.5.0 Cython==0.29.33 jinja2 pkginfo packaging setuptools tqdm==4.67.1
      - name: Validar isolamento privado e persistencia antes de gerar APK
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 -B tools/test_android_profiles.py --out qa/android-profile-contracts-ci
      - name: Verificar harness de reabertura inclusive com bytecode otimizado
        run: python -X utf8 -B -m unittest -v tools.test_android_emulator_harness
      - name: NDK fixado e SDK provisionado
        run: |
          test -d "$ANDROID_HOME/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build limpo do commit da branch derivada da main
        run: python tools/build_android.py --output "$RUNNER_TEMP/android-${{ matrix.arch }}" --arch "${{ matrix.arch }}"
      - name: Verificar pacote e assinatura existente, sem criar identidade de producao
        env:
          PESCA_SIGN_KEY: ${{ secrets.PESCA_IDLE_ANDROID_KEYSTORE }}
          PESCA_SIGN_PASSWORD: ${{ secrets.PESCA_IDLE_ANDROID_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/android-${{ matrix.arch }}"
          "$BT/zipalign" -P 16 -f 4 "$OUT/PescaIdle-${{ matrix.arch }}-unsigned.apk" "$OUT/aligned.apk"
          if test '${{ matrix.arch }}' = x86_64; then
            keytool -genkeypair -keystore "$RUNNER_TEMP/android-qa-debug.jks" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 30
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/android-qa-debug.jks" --ks-pass pass:android --key-pass pass:android --out "$OUT/PescaIdle-x86_64.apk" "$OUT/aligned.apk"
            "$BT/apksigner" verify --verbose --print-certs "$OUT/PescaIdle-x86_64.apk" > "$OUT/signature.txt"
            rm "$RUNNER_TEMP/android-qa-debug.jks"
            echo 'Pacote QA separado; certificado efemero de teste, nunca identidade de producao.' > "$OUT/distribution.txt"
          elif test -n "$PESCA_SIGN_KEY" && test -n "$PESCA_SIGN_PASSWORD"; then
            printf '%s' "$PESCA_SIGN_KEY" | base64 --decode > "$RUNNER_TEMP/pesca-sign.p12"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/pesca-sign.p12" --ks-type PKCS12 --ks-pass env:PESCA_SIGN_PASSWORD --out "$OUT/PescaIdle-aarch64.apk" "$OUT/aligned.apk"
            "$BT/apksigner" verify --verbose --print-certs "$OUT/PescaIdle-aarch64.apk" > "$OUT/signature.txt"
            rm "$RUNNER_TEMP/pesca-sign.p12"
            echo 'Assinatura oficial existente; ainda depende da validacao funcional QA e dos limites ARM64.' > "$OUT/distribution.txt"
          else
            cp "$OUT/aligned.apk" "$OUT/PescaIdle-aarch64-NAO-ASSINADO.apk"
            echo 'Credenciais oficiais indisponiveis. APK nao assinado; nao instalavel/distribuivel como pronto.' > "$OUT/distribution.txt"
          fi
          "$BT/aapt" dump badging "$OUT/aligned.apk" > "$OUT/package.txt"
          "$BT/zipalign" -c -P 16 4 "$OUT/aligned.apk" > "$OUT/alignment.txt"
          (cd "$OUT" && sha256sum PescaIdle-*.apk > sha256.txt)
      - name: Registrar hashes finais e commit de origem
        run: python tools/record_android_build.py --output "$RUNNER_TEMP/android-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-build-input-nao-validado-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/android-${{ matrix.arch }}/PescaIdle-*.apk
            ${{ runner.temp }}/android-${{ matrix.arch }}/build.json
            ${{ runner.temp }}/android-${{ matrix.arch }}/BUILD-FINAL.json
            ${{ runner.temp }}/android-${{ matrix.arch }}/signature.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/package.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/alignment.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/sha256.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/distribution.txt
  android-native-qa:
    needs: android
    if: always() && needs.android.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Android-build-input-nao-validado-x86_64
          path: android-apk
      - name: Instalar, testar e reabrir processo Android 15 descartavel
        run: python tools/test_android_emulator.py android-apk --output "$RUNNER_TEMP/emulator-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Evidencias-Android-nativo
          path: |
            ${{ runner.temp }}/emulator-qa/*.json
            ${{ runner.temp }}/emulator-qa/*.png
            ${{ runner.temp }}/emulator-qa/*.txt
            ${{ runner.temp }}/emulator-qa/*.log
      - uses: actions/upload-artifact@v4
        with:
          name: PescaIdle-Android-QA-x86_64-validado
          path: android-apk/
