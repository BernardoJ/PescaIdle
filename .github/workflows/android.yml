name: Android completo
on:
  push:
    branches: [codex/android-auditoria]
    paths-ignore: ['**.md', 'PescaIdle.exe', 'PescaIdle.apk', 'docs/**']
  workflow_dispatch:
    inputs:
      test_run_id:
        description: 'Run com APK QA já compilado (vazio para compilar tudo)'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: inputs.test_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependências de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev libffi-dev libssl-dev pkg-config cmake ninja-build libxcb-cursor0 libegl1 libxkbcommon0
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install PySide6==6.11.2 buildozer==1.5.0 Cython==0.29.33 jinja2 pkginfo packaging setuptools tqdm==4.67.1
      - name: Correções e conquistas com perfil sintético
        env:
          QT_QPA_PLATFORM: offscreen
          PESCA_IDLE_QA_DIR: ${{ runner.temp }}/audit
        run: python tools/validate_audit.py
      - name: NDK compatível com as bibliotecas Qt
        run: |
          test -d "$ANDROID_HOME/licenses"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar APK
        run: python tools/build_android.py --output "$RUNNER_TEMP/android-${{ matrix.arch }}" --arch "${{ matrix.arch }}"
      - name: Assinar e verificar
        env:
          PESCA_SIGN_KEY: ${{ secrets.PESCA_IDLE_ANDROID_KEYSTORE }}
          PESCA_SIGN_PASSWORD: ${{ secrets.PESCA_IDLE_ANDROID_PASSWORD }}
        run: |
          test -n "$PESCA_SIGN_KEY" && test -n "$PESCA_SIGN_PASSWORD"
          printf '%s' "$PESCA_SIGN_KEY" | base64 --decode > "$RUNNER_TEMP/pesca-sign.p12"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/android-${{ matrix.arch }}"
          "$BT/zipalign" -P 16 -f 4 "$OUT/PescaIdle-${{ matrix.arch }}-unsigned.apk" "$OUT/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/pesca-sign.p12" --ks-type PKCS12 --ks-pass env:PESCA_SIGN_PASSWORD --out "$OUT/PescaIdle-${{ matrix.arch }}.apk" "$OUT/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT/PescaIdle-${{ matrix.arch }}.apk" > "$OUT/signature.txt"
          "$BT/aapt" dump badging "$OUT/PescaIdle-${{ matrix.arch }}.apk" > "$OUT/package.txt"
          "$BT/zipalign" -c -P 16 4 "$OUT/PescaIdle-${{ matrix.arch }}.apk" > "$OUT/alignment.txt"
          sha256sum "$OUT/PescaIdle-${{ matrix.arch }}.apk" > "$OUT/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PescaIdle-Android-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/android-${{ matrix.arch }}/PescaIdle-${{ matrix.arch }}.apk
            ${{ runner.temp }}/android-${{ matrix.arch }}/build.json
            ${{ runner.temp }}/android-${{ matrix.arch }}/signature.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/package.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/sha256.txt
            ${{ runner.temp }}/android-${{ matrix.arch }}/alignment.txt
            ${{ runner.temp }}/audit/audit.json
  emulator:
    needs: build
    if: always() && (inputs.test_run_id != '' || needs.build.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: PescaIdle-Android-x86_64
          path: android-apk
          run-id: ${{ inputs.test_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Instalar e executar em Android 15 descartável
        run: python tools/test_android_emulator.py android-apk --output "$RUNNER_TEMP/emulator-qa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-evidence
          path: ${{ runner.temp }}/emulator-qa
